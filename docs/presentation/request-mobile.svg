<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1160" viewBox="0 0 375 1160" role="img" aria-labelledby="request-mobile-title request-mobile-desc"><title id="request-mobile-title">Same capability, newly allowed request</title><desc id="request-mobile-desc">A synthetic POST to legacy/release is denied with HTTP 403 before and allowed with HTTP 204 after removing parameter restrictions, while both capability probes return create and update; matching expectations alone does not approve the expansion.</desc><rect width="100%" height="100%" fill="#f5f4ee"/><text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#174c67">PolicyDelta / REQUEST-LEVEL EVIDENCE</text><text x="24" y="80" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#202724">Same capability.</text><text x="24" y="120" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#202724">Newly allowed request.</text><text x="24" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#59635d">ONE SYNTHETIC REQUEST · forbidden-parameter</text><text x="24" y="194" font-family="Courier New, Courier, monospace" font-size="20" fill="#174c67">POST legacy/release</text><text x="24" y="224" font-family="Courier New, Courier, monospace" font-size="17" fill="#202724">stage = &quot;prod&quot;</text><rect x="20" y="272" width="335" height="260" fill="#fffefa" stroke="#a6b3aa"/><text x="36" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59635d">BEFORE POLICY</text><text x="36" y="337" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#202724">Stage restricted to &quot;test&quot;</text><text x="36" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59635d">Required stage + allowed_parameters</text><text x="36" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59635d">Capability probe</text><text x="36" y="430" font-family="Courier New, Courier, monospace" font-size="19" fill="#174c67">create, update</text><text x="36" y="479" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#7c3f24">HTTP 403 · DENY</text><text x="36" y="511" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#59635d">Actual OpenBao 2.7.0 observation</text><rect x="20" y="560" width="335" height="260" fill="#fffefa" stroke="#a6b3aa"/><text x="36" y="590" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59635d">AFTER POLICY</text><text x="36" y="625" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#202724">Parameter restrictions removed</text><text x="36" y="654" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59635d">Same path and create/update grant</text><text x="36" y="692" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59635d">Capability probe</text><text x="36" y="718" font-family="Courier New, Courier, monospace" font-size="19" fill="#174c67">create, update</text><text x="36" y="767" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#216846">HTTP 204 · ALLOW</text><text x="36" y="799" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#59635d">Actual OpenBao 2.7.0 observation</text><text x="24" y="904" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#202724">Approval changes the suite verdict,</text><text x="24" y="932" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#202724">not the observed access expansion.</text><text x="24" y="973" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#7c3f24">Unapproved → exit 1</text><text x="24" y="1007" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#7c3f24">Expect allow alone → exit 1</text><text x="24" y="1041" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#216846">Expect allow + approve → exit 0</text><text x="24" y="1094" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59635d">Full suite: 11 cases, 4 expansions.</text><text x="24" y="1122" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59635d">Finite synthetic regression, not policy proof.</text></svg>