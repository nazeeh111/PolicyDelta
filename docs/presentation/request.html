<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PolicyDelta request evidence</title><style>body{margin:0;background:#f5f4ee}svg{display:block;width:100%;height:auto}</style><main><svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="request-title request-desc"><title id="request-title">Same capability, newly allowed request</title><desc id="request-desc">A synthetic POST to legacy/release is denied with HTTP 403 before and allowed with HTTP 204 after removing parameter restrictions, while both capability probes return create and update; matching expectations alone does not approve the expansion.</desc><rect width="100%" height="100%" fill="#f5f4ee"/><text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#174c67">PolicyDelta / REQUEST-LEVEL EVIDENCE</text><text x="40" y="100" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#202724">Same capability. Newly allowed request.</text><text x="40" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#59635d">ONE SYNTHETIC REQUEST · forbidden-parameter</text><text x="40" y="174" font-family="Courier New, Courier, monospace" font-size="20" fill="#174c67">POST legacy/release</text><text x="40" y="204" font-family="Courier New, Courier, monospace" font-size="17" fill="#202724">stage = &quot;prod&quot;</text><rect x="40" y="260" width="600" height="260" fill="#fffefa" stroke="#a6b3aa"/><text x="56" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59635d">BEFORE POLICY</text><text x="56" y="325" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#202724">Stage restricted to &quot;test&quot;</text><text x="56" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59635d">Required stage + allowed_parameters</text><text x="56" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59635d">Capability probe</text><text x="56" y="418" font-family="Courier New, Courier, monospace" font-size="19" fill="#174c67">create, update</text><text x="56" y="467" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#7c3f24">HTTP 403 · DENY</text><text x="56" y="499" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#59635d">Actual OpenBao 2.7.0 observation</text><rect x="664" y="260" width="600" height="260" fill="#fffefa" stroke="#a6b3aa"/><text x="680" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59635d">AFTER POLICY</text><text x="680" y="325" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#202724">Parameter restrictions removed</text><text x="680" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59635d">Same path and create/update grant</text><text x="680" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59635d">Capability probe</text><text x="680" y="418" font-family="Courier New, Courier, monospace" font-size="19" fill="#174c67">create, update</text><text x="680" y="467" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#216846">HTTP 204 · ALLOW</text><text x="680" y="499" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#59635d">Actual OpenBao 2.7.0 observation</text><text x="40" y="568" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#59635d">OBSERVATIONS RETAINED / THREE REVIEW CONFIGURATIONS</text><text x="40" y="608" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#7c3f24">Unapproved: exit 1</text><text x="440" y="608" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#7c3f24">Expect allow alone: exit 1</text><text x="876" y="608" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#216846">Expect + approve: exit 0</text><text x="40" y="650" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#59635d">The full suite has 11 cases and 4 expansions; 2 keep identical capability lists. Approval is explicit per named case.</text><text x="40" y="686" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#59635d">Synthetic local observations. This is not an internal authorization trace or a proof of complete policy safety.</text></svg></main></html>
